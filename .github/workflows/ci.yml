name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rid: win-x64
            archive: hollywood-win-x64.zip
          - label: Windows ARM64
            os: windows-11-arm
            rid: win-arm64
            archive: hollywood-win-arm64.zip
          - label: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
            archive: hollywood-linux-x64.tar.gz
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            rid: linux-arm64
            archive: hollywood-linux-arm64.tar.gz
          - label: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            archive: hollywood-osx-x64.tar.gz
          - label: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
            archive: hollywood-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    env:
      HOLLYWOOD_VERSION: ${{ inputs.version || '0.2.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Release
        run: dotnet build Hollywood.sln -c Release

      - name: Run shared regression harness
        run: dotnet run --project tests/Hollywood.UnitTests -c Release --no-build

      - name: CLI, configuration, and deterministic snapshot smoke tests
        shell: bash
        run: |
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- --help
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- config validate examples/config.json
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- --snapshot --theme retro --layout dense --seed 42 > "$RUNNER_TEMP/snapshot.txt"
          test -s "$RUNNER_TEMP/snapshot.txt"

      - name: Publish self-contained single-file executable
        shell: bash
        run: dotnet publish src/Hollywood.Cli/Hollywood.Cli.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:Version="$HOLLYWOOD_VERSION" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish

      - name: Windows ConPTY integration test
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: dotnet run --project tests/Hollywood.ConPty -c Release --no-build -- artifacts/publish/hollywood.exe

      - name: Linux and macOS PTY integration test
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: python3 tests/posix-pty.py artifacts/publish/hollywood


      - name: Package and verify the extracted executable
        shell: bash
        run: python packaging/release/package.py --rid "${{ matrix.rid }}" --version "$HOLLYWOOD_VERSION" --commit "$GITHUB_SHA" --publish artifacts/publish --output artifacts/packages

      - name: Install and exercise the packaged POSIX app
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: python tests/installation/posix-install.py "artifacts/packages/${{ matrix.archive }}" "$HOLLYWOOD_VERSION"

      - name: Build and exercise per-user Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 -Version $env:HOLLYWOOD_VERSION -SetupOnly
          ./tests/installation/build-fixtures.ps1
          ./tests/installation/windows-install.ps1 `
            -Version $env:HOLLYWOOD_VERSION `
            -SetupPath ./artifacts/installer/releases/windows/Hollywood-Setup.exe `
            -UpgradeSetupPath ./artifacts/installer/test-fixtures/Hollywood-Upgrade-Test.exe `
            -FailingSetupPath ./artifacts/installer/test-fixtures/Hollywood-Failure-Test.exe `
            -SkipDefaultDirectory -SkipCollision -AllowElevatedTestHost

      - name: Upload build evidence and package
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-${{ matrix.rid }}
          path: |
            artifacts/packages/${{ matrix.archive }}
            artifacts/packages/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows setup validation artifacts
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-windows-setup-validation
          path: |
            artifacts/installer/releases/windows/Hollywood-Setup.exe
            artifacts/installer/releases/windows/Hollywood-Setup.exe.sha256
            artifacts/installer/releases/windows/artifact-metadata.json
          if-no-files-found: error
          retention-days: 30
