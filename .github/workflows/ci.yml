name: Cross-platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rid: win-x64
            archive: hollywood-win-x64.zip
          - label: Windows ARM64
            os: windows-11-arm
            rid: win-arm64
            archive: hollywood-win-arm64.zip
          - label: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
            archive: hollywood-linux-x64.tar.gz
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            rid: linux-arm64
            archive: hollywood-linux-arm64.tar.gz
          - label: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            archive: hollywood-osx-x64.tar.gz
          - label: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
            archive: hollywood-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Release
        run: dotnet build Hollywood.sln -c Release

      - name: Run shared regression harness
        run: dotnet run --project tests/Hollywood.UnitTests -c Release --no-build

      - name: CLI, configuration, and deterministic snapshot smoke tests
        shell: bash
        run: |
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- --help
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- config validate examples/config.json
          dotnet run --project src/Hollywood.Cli -c Release --no-build -- --snapshot --theme retro --layout dense --seed 42 > "$RUNNER_TEMP/snapshot.txt"
          test -s "$RUNNER_TEMP/snapshot.txt"

      - name: Publish self-contained single-file executable
        shell: bash
        run: dotnet publish src/Hollywood.Cli/Hollywood.Cli.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=true -o artifacts/publish

      - name: Windows ConPTY integration test
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: dotnet run --project tests/Hollywood.ConPty -c Release --no-build -- artifacts/publish/hollywood.exe

      - name: Build and exercise per-user Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 -Version 0.2.0
          ./tests/installation/build-fixtures.ps1
          ./tests/installation/windows-install.ps1 `
            -SetupPath ./artifacts/installer/releases/windows/Hollywood-Setup.exe `
            -UpgradeSetupPath ./artifacts/installer/test-fixtures/Hollywood-Upgrade-Test.exe `
            -FailingSetupPath ./artifacts/installer/test-fixtures/Hollywood-Failure-Test.exe `
            -SkipDefaultDirectory -SkipCollision -AllowElevatedTestHost

      - name: Linux and macOS PTY integration test
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: python3 tests/posix-pty.py artifacts/publish/hollywood

      - name: Package ZIP and SHA-256 manifest
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package | Out-Null
          Copy-Item artifacts/publish/* artifacts/package/ -Recurse -Force
          $metadata = @{ runtimeIdentifier = '${{ matrix.rid }}'; commit = '${{ github.sha }}'; runner = '${{ matrix.os }}' } | ConvertTo-Json
          Set-Content artifacts/package/artifact-metadata.json $metadata
          $zip = 'artifacts/${{ matrix.archive }}'
          Compress-Archive -Path artifacts/package/* -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "${zip}.sha256" "$hash  ${{ matrix.archive }}" -Encoding ascii

      - name: Package tarball and SHA-256 manifest
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          mkdir -p artifacts/package
          cp -R artifacts/publish/. artifacts/package/
          printf '{"runtimeIdentifier":"%s","commit":"%s","runner":"%s"}\n' '${{ matrix.rid }}' '${{ github.sha }}' '${{ matrix.os }}' > artifacts/package/artifact-metadata.json
          tar -C artifacts/package -czf "$RUNNER_TEMP/${{ matrix.archive }}" .
          mv "$RUNNER_TEMP/${{ matrix.archive }}" "artifacts/${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "artifacts/${{ matrix.archive }}" > "artifacts/${{ matrix.archive }}.sha256"; else shasum -a 256 "artifacts/${{ matrix.archive }}" > "artifacts/${{ matrix.archive }}.sha256"; fi

      - name: Upload build evidence and package
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.archive }}
            artifacts/${{ matrix.archive }}.sha256
            artifacts/publish/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows setup validation artifacts
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-windows-setup-validation
          path: |
            artifacts/installer/releases/windows/Hollywood-Setup.exe
            artifacts/installer/releases/windows/Hollywood-Setup.exe.sha256
            artifacts/installer/releases/windows/artifact-metadata.json
          if-no-files-found: error
          retention-days: 30
